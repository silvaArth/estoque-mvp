<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endereçamento de Estoque — Rack 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topo">
    <div class="marca">
      <span class="marca-tag">ENDEREÇAMENTO</span>
      <h1>Rack 01</h1>
    </div>
    <nav class="abas" role="tablist">
      <button class="aba ativa" data-aba="mapa">Mapa do Rack</button>
      <button class="aba" data-aba="movimentar">Movimentar</button>
      <button class="aba" data-aba="cadastrar">Produtos</button>
      <button class="aba" data-aba="consultar">Consultar</button>
    </nav>
    <div class="export-grupo">
      <button id="btn-exportar-xls" class="btn-exportar" title="Exportar estoque em Excel (.xls)">
        .XLS
      </button>
      <button id="btn-exportar-csv" class="btn-exportar" title="Exportar estoque em CSV (.csv)">
        .CSV
      </button>
    </div>
  </header>

  <main>

    <!-- MAPA DO RACK -->
    <section id="painel-mapa" class="painel painel-ativo">
      <div class="controles-mapa">
        <div class="seletor-rack-box">
          <label for="select-rua">Rua:</label>
          <select id="select-rua" class="seletor-rack">
            <option value="">Carregando...</option>
          </select>
          <label for="select-rack">Rack:</label>
          <select id="select-rack" class="seletor-rack">
            <option value="">Carregando...</option>
          </select>
        </div>
        <p class="legenda">
          <span class="chip chip-vazia"></span> vaga livre
          <span class="chip chip-ocupada"></span> vaga ocupada
        </p>
      </div>
      <div id="grade-rack" class="grade-rack" aria-label="Mapa visual do rack"></div>
    </section>

    <!-- MODAL DE DETALHES DA VAGA -->
    <div id="modal-vaga" class="modal-overlay oculto" role="dialog" aria-modal="true">
      <div class="modal-card">
        <button id="modal-fechar" class="modal-fechar" aria-label="Fechar">&times;</button>
        <div id="modal-conteudo"></div>
      </div>
    </div>

    <!-- MOVIMENTAR -->
    <section id="painel-movimentar" class="painel">
      <form id="form-movimentacao" class="form-scan">
        <label>
          Código do produto
          <input id="input-item" type="text" autocomplete="off" placeholder="Escaneie ou digite" required>
        </label>
        <label>
          Código da posição
          <input id="input-localizacao" type="text" autocomplete="off" placeholder="Escaneie ou digite" required>
        </label>
        <div class="linha-dupla">
          <label>
            Tipo
            <select id="input-tipo" required>
              <option value="entrada">Entrada</option>
              <option value="saida">Saída</option>
            </select>
          </label>
          <label>
            Quantidade
            <input id="input-quantidade" type="number" min="1" value="1" required>
          </label>
        </div>
        <label>
          Operador (opcional)
          <input id="input-operador" type="text" autocomplete="off">
        </label>
        <button type="submit" class="btn-primario">Registrar movimentação</button>
        <p id="feedback-movimentacao" class="feedback"></p>
      </form>
    </section>

    <!-- GERENCIAR PRODUTOS (CADASTRAR / EXCLUIR) -->
    <section id="painel-cadastrar" class="painel">
      <div class="consulta-grid">
        <form id="form-cadastro-item" class="form-scan">
          <h3 style="margin: 0 0 8px; font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Cadastrar Novo Produto</h3>
          <label>
            Código de Barras *
            <input id="input-cad-codigo" type="text" autocomplete="off" placeholder="Escaneie ou digite o código de barras" required>
          </label>
          <label>
            Descrição do Produto *
            <input id="input-cad-descricao" type="text" autocomplete="off" placeholder="Ex: Malbec Desodorante Colônia 100ml" required>
          </label>
          <label>
            SKU / Código Interno (opcional)
            <input id="input-cad-sku" type="text" autocomplete="off" placeholder="Deixe em branco para usar o mesmo código de barras">
          </label>
          <button type="submit" class="btn-primario">Salvar Produto</button>
          <p id="feedback-cadastro" class="feedback"></p>
        </form>

        <form id="form-excluir-item" class="form-scan" style="border-color: rgba(181, 72, 47, 0.3);">
          <h3 style="margin: 0 0 8px; font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--saida);">Excluir Produto</h3>
          <label>
            Código de Barras ou SKU *
            <input id="input-exc-codigo" type="text" autocomplete="off" placeholder="Escaneie ou digite para excluir" required>
          </label>
          <p style="font-size: 12px; color: var(--tinta-suave); margin: -4px 0 8px;">
            ⚠️ Esta ação removerá o produto e limpará seu histórico do estoque.
          </p>
          <button type="submit" class="btn-perigo">Excluir Produto</button>
          <p id="feedback-exclusao" class="feedback"></p>
        </form>
      </div>
    </section>

    <!-- CONSULTAR -->
    <section id="painel-consultar" class="painel">
      <div class="consulta-grid">
        <form id="form-consulta-item" class="form-consulta">
          <label>
            Onde está o produto?
            <input id="input-consulta-item" type="text" autocomplete="off" placeholder="Código do produto">
          </label>
          <button type="submit">Buscar</button>
          <div id="resultado-consulta-item" class="resultado"></div>
        </form>
        <form id="form-consulta-local" class="form-consulta">
          <label>
            O que tem nessa posição?
            <input id="input-consulta-local" type="text" autocomplete="off" placeholder="Código da posição">
          </label>
          <button type="submit">Buscar</button>
          <div id="resultado-consulta-local" class="resultado"></div>
        </form>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>

</html>
